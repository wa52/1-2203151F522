name: Build Canon RAG metadata

on:
  workflow_dispatch:
  push:
    paths:
      - "cleaned/novel.cleaned.txt"
      - "tools/build_canon_rag.py"
      - "tools/build_lu_xin_profile.py"
      - ".github/workflows/build-canon-rag.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build local full-text index and public metadata
        run: |
          python tools/build_canon_rag.py build
      - name: Build Lu Xin Canon Profile
        run: |
          python tools/build_lu_xin_profile.py

      - name: Validate local retrieval
        run: |
          python tools/build_canon_rag.py search "陆辛 二十三岁 年龄" --top-k 5 --preview-chars 180
          python tools/build_canon_rag.py search "陆辛 普通 年轻人 长相 模样" --top-k 5 --preview-chars 180
          python tools/build_canon_rag.py search "陆辛 公司 办公室 同事 上班 工作" --top-k 5 --preview-chars 180
          python tools/build_canon_rag.py search "陆辛 礼貌 客气 平静 安静 认真" --top-k 5 --preview-chars 180
          python tools/build_canon_rag.py search "陆辛 妹妹 妈妈 爸爸 家人 回家" --top-k 5 --preview-chars 180
          python tools/build_canon_rag.py show ch-0201-ck-002 --focus 陆辛 --preview-chars 420
          python tools/build_canon_rag.py show ch-0059-ck-002 --focus 陆辛 --preview-chars 420
          python tools/build_canon_rag.py show ch-0036-ck-002 --focus 陆辛 --preview-chars 420
          python tools/build_canon_rag.py show ch-0040-ck-001 --focus 陆辛 --preview-chars 420
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/canon_index_report.json canon/lu_xin.candidates.json canon/lu_xin.profile.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "Build Canon RAG metadata for Lu Xin"
          git pull --rebase origin main
          git push
